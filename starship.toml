format = "$directory$git_branch$git_status$character"

[directory]
truncation_length = 3
home_symbol = "~"
style = "bold cyan"

[git_branch]
style = "bold yellow"

[git_status]
style = "bold red"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
